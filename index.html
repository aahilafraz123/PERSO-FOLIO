<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>RELENTLESS — The Wilderness</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #05060a;
        overflow: hidden;
        font-family: "Courier New", ui-monospace, monospace;
      }
      #app {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(120% 120% at 50% 40%, #0b0d16 0%, #05060a 70%, #000 100%);
      }
      /* Crisp pixels, no smoothing */
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        /* soft vignette baked around the canvas */
        box-shadow: 0 0 120px 40px rgba(0, 0, 0, 0.9) inset,
                    0 0 60px rgba(0, 0, 0, 0.8);
      }
      /* faint scanline texture over the whole thing */
      #app::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0) 0px,
          rgba(0, 0, 0, 0) 2px,
          rgba(0, 0, 0, 0.18) 3px
        );
        mix-blend-mode: multiply;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
